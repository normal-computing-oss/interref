packages:
  - packages/*

# Versions shared by more than one package. Packages refer to them as "catalog:".
catalog:
  "@types/node": ^22.20.5
  esbuild: ^0.28.2

# Dependencies that may run install scripts. pnpm blocks all others.
allowBuilds:
  esbuild: true
  "@vscode/vsce-sign": false

# pnpm blocks very new releases. The pinned tsrs beta is newer than that limit.
minimumReleaseAgeExclude:
  - "@tsrs/darwin-arm64@0.20.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.20.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.20.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.20.0-ts7.1.0-beta"
  - tsrs@0.20.0-ts7.1.0-beta
