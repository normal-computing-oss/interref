# Starts when `pnpm release <version>` pushes a v* tag. Publishes the CLI to npm, then makes a
# GitHub release with the CLI tarball and the VS Code extension (.vsix).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing (OIDC); no npm token is stored in the repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or later
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the package versions
        run: |
          for file in packages/*/package.json; do
            version=$(node -p "require('./$file').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$file has version $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: pnpm check

      - name: Pack
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir release
          (cd packages/cli && pnpm pack --pack-destination ../../release)
          pnpm --filter vscode-interref package
          cp packages/vscode/interref.vsix "release/interref-$version.vsix"
          ls -l release

      # pnpm packs, so the tarball has no workspace: versions. npm publishes, because it does
      # the trusted publishing and adds provenance. The path must start with ./, or npm reads
      # release/… as a GitHub repo.
      - name: Publish the CLI to npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish ./release/*.tgz --tag next ;;
            *) npm publish ./release/*.tgz ;;
          esac

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes $prerelease
